# Lint config. Run: ruff check .
# F = pyflakes, E9 = syntax errors, B = bugbear (catches .strip('.exe'),
# mutable defaults, ...), PLE = pylint errors (e.g. bad .format arguments)
target-version = "py310"
extend-exclude = ["ui_Submission.py", "ui_images_rc.py"]

[lint]
select = ["F", "E9", "B", "PLE"]
# existing noise, to be cleaned up later
ignore = ["F401", "F841", "B007", "B905", "F541", "F811"]
